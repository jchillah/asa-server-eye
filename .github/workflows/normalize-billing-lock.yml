name: Normalize billing lockfile

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  normalize-lockfile:
    if: github.head_ref == 'agent/update-play-billing-8'
    runs-on: ubuntu-latest

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up current Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies using project CI toolchain
        run: flutter pub get

      - name: Verify Billing Library 8 plugin resolution
        shell: bash
        run: |
          grep -A 7 '^  in_app_purchase:$' pubspec.lock | grep 'version: "3.3.0"'
          grep -A 7 '^  in_app_purchase_android:$' pubspec.lock | grep 'version: "0.5.0"'

      - name: Commit normalized lockfile
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock already matches the current stable toolchain."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore: normalize dependency lock"
          git push origin "HEAD:${HEAD_BRANCH}"
