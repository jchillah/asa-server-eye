name: Refresh billing dependency lock

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-dependencies:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/update-play-billing-8'
    runs-on: ubuntu-latest

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify Play Billing compatible plugin versions
        shell: bash
        run: |
          grep -A 7 '^  in_app_purchase:$' pubspec.lock | grep 'version: "3.3.0"'
          grep -A 7 '^  in_app_purchase_android:$' pubspec.lock | grep 'version: "0.5.0"'

      - name: Commit refreshed lockfile
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore: refresh dependency lock"
          git push origin "HEAD:${HEAD_BRANCH}"
