name: PR Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  flutter-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Build release AAB
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  functions-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci

      - name: Lint Functions
        run: npm run lint

      - name: Test Functions
        run: npm test

  release-data-safety:
    if: startsWith(github.head_ref, 'release/play-production-')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests

      - name: Write Google Play service account
        run: |
          cat <<'EOF' > play-service-account.json
          ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          EOF

      - name: Publish audited Google Play Data Safety declaration
        env:
          GOOGLE_APPLICATION_CREDENTIALS: play-service-account.json
          PLAY_PACKAGE_NAME: com.jchillah.asaservereye
          DATA_SAFETY_OUTPUT: data-safety-generated.csv
        run: python .github/scripts/update_play_data_safety.py

      - name: Upload generated declaration for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-play-data-safety
          path: data-safety-generated.csv
          if-no-files-found: ignore
          retention-days: 14

  release-firestore-rules:
    if: startsWith(github.head_ref, 'release/play-production-')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests

      - name: Select Firebase credential
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > firebase-service-account.json
          elif [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > firebase-service-account.json
          else
            echo "No service-account credential is configured for Firebase Rules." >&2
            exit 1
          fi

      - name: Deploy Firestore rules through Firebase Rules API
        env:
          GOOGLE_APPLICATION_CREDENTIALS: firebase-service-account.json
          FIREBASE_PROJECT_ID: asa-server-eye
          FIRESTORE_RULES_FILE: firestore.rules
        run: python .github/scripts/deploy_firestore_rules.py
